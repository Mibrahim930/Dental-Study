# Checks every push and pull request before anything reaches Railway: types, lint, the test suite, and known
# security advisories in the packages the live site runs.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Dummy values: the tests sign cookies and gate pages with them. Nothing real is used in CI.
      SECRET_KEY: ci-dummy-secret
      APP_PASSCODE: ci-dummy-passcode
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: seven migration tests read old versions of files with `git show`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generates the RouteContext/PageProps types tsc needs; the throwaway DATA_DIR keeps it away from any real data.
      - run: DATA_DIR=$RUNNER_TEMP/typegen npx next typegen
      - run: NODE_OPTIONS=--max-old-space-size=6144 npx tsc --noEmit -p .
      - run: npx eslint .
      - run: npx vitest run
      - run: npm audit --omit=dev --audit-level=high

  # Browser tests (e2e/): the student journeys on a phone-sized screen, against `next dev` with the fake AI (no keys,
  # no network calls to an AI) and a throwaway data folder. Traces and screenshots of any failure are uploaded.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            e2e/.results/
            e2e/.report/
          retention-days: 14
